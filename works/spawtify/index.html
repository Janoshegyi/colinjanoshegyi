<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
/>

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Wrapped Experience</title>

<style>

/* =========================
   RESET
========================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:black;
  font-family:sans-serif;
}

body{
  padding:
    env(safe-area-inset-top)
    env(safe-area-inset-right)
    env(safe-area-inset-bottom)
    env(safe-area-inset-left);
}

/* =========================
   OVERLAY
========================= */

#startOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.96);

  display:flex;
  justify-content:center;
  align-items:center;

  z-index:9999;

  transition:opacity .6s ease;
}

#passwordBox{
  width:90%;
  max-width:340px;

  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px;

  color:white;
}

.welcomeText{
  font-size:28px;
  font-weight:700;
  letter-spacing:1px;
}

.subtitle{
  font-size:14px;
  opacity:.7;
  text-align:center;
  margin-bottom:8px;
}

#passwordInput{
  width:100%;

  padding:14px 16px;

  border:none;
  border-radius:16px;

  background:rgba(255,255,255,0.08);

  color:white;
  font-size:16px;
  text-align:center;

  outline:none;

  border:1px solid rgba(255,255,255,0.12);

  transition:border .25s ease,
             background .25s ease;
}

#passwordInput:focus{
  border:1px solid rgba(255,255,255,0.35);
  background:rgba(255,255,255,0.12);
}

#passwordInput::placeholder{
  color:rgba(255,255,255,0.45);
}

#enterBtn{
  width:100%;

  padding:14px;

  border:none;
  border-radius:16px;

  background:white;
  color:black;

  font-size:16px;
  font-weight:700;

  cursor:pointer;

  transition:
    transform .15s ease,
    opacity .2s ease;
}

#enterBtn:hover{
  opacity:.9;
}

#enterBtn:active{
  transform:scale(.98);
}

#passwordError{
  min-height:20px;
  font-size:14px;
  color:#ff9090;
}

#loaderText{
  font-size:13px;
  letter-spacing:1px;
  color:rgba(255,255,255,0.6);
  margin-top:4px;
}

/* =========================
   APP
========================= */

#app{
  width:100vw;
  height:100dvh;
  overflow:hidden;
  position:relative;
}

.slides{
  width:100%;
  height:100%;

  display:flex;
  flex-direction:column;

  transition:
    transform .7s cubic-bezier(0.22, 1, 0.36, 1);

  will-change:transform;
}

.slide{
  width:100%;
  min-height:100dvh;

  position:relative;
  overflow:hidden;

  background:black;
}

.slide img{
  width:100%;
  height:100%;

  object-fit:cover;

  opacity:0;
  transform:scale(1.05);

  transition:
    opacity 1s ease,
    transform 1.2s ease;

  will-change:transform, opacity;

  user-select:none;
  -webkit-user-drag:none;
  pointer-events:none;
}

.slide.active img{
  opacity:1;
  transform:scale(1);
}

/* =========================
   PROGRESS
========================= */

.progress{
  position:fixed;
  top:0;
  left:0;

  width:100%;

  display:flex;
  gap:4px;

  padding:12px;

  z-index:100;
}

.bar{
  flex:1;
  height:4px;

  background:rgba(255,255,255,0.18);

  border-radius:999px;
  overflow:hidden;
}

.bar-inner{
  width:0%;
  height:100%;

  background:white;

  transition:width .4s ease;
}

canvas{
  position:fixed;
  inset:0;
  pointer-events:none;
}

</style>
</head>

<body>

<!-- =========================
     PASSWORD OVERLAY
========================= -->

<div id="startOverlay">

  <div id="passwordBox">

    <div class="welcomeText">
      Enter Password
    </div>

    <div class="subtitle">
      Private wrapped experience
    </div>

    <input
      type="text"
      id="passwordInput"
      placeholder="Password"
      autocomplete="off"
      autocapitalize="none"
      spellcheck="false"
    />

    <button id="enterBtn">
      Enter
    </button>

    <div id="passwordError"></div>

    <div id="loaderText">
      Loading experience...
    </div>

  </div>

</div>

<!-- =========================
     APP
========================= -->

<div id="app">

  <div class="progress" id="progress"></div>

  <div class="slides" id="slides"></div>

</div>

<script>

/* =========================
   CONFIG
========================= */

const PASSWORD = "bellaisadorable";

const slidesData = [

  {
    img:"assets/slide1.png",
    audio:"https://res.cloudinary.com/dc0gynqrj/video/upload/v1777781825/0108_ybgkxk.mp3"
  },

  {
    img:"assets/slide2.png",
    audio:"https://res.cloudinary.com/dc0gynqrj/video/upload/v1777783269/0108_1_kdyq3e.mp3"
  },

  {
    img:"assets/slide3.png",
    audio:"https://res.cloudinary.com/dc0gynqrj/video/upload/v1777784343/0108_2_ukovwm.mp3"
  },

  {
    img:"assets/slide4.png",
    audio:"https://res.cloudinary.com/dc0gynqrj/video/upload/v1777784846/0108_4_ry0fbn.mp3"
  },

  {
    img:"assets/slide5.png",
    audio:"https://res.cloudinary.com/dc0gynqrj/video/upload/v1777785194/0108_5_dtchbf.mp3"
  },

  {
    img:"assets/slide6.png",
    audio:"https://res.cloudinary.com/dc0gynqrj/video/upload/v1777786058/0108_6_izkhha.mp3"
  },

  {
    img:"assets/slide7.png",
    audio:"https://res.cloudinary.com/dc0gynqrj/video/upload/v1777793740/0108_7_v4ttdt.mp3"
  },

  {
    img:"assets/slide8.png",
    audio:"https://res.cloudinary.com/dc0gynqrj/video/upload/v1777795555/0108_8_eqanei.mp3"
  },

  {
    img:"assets/slide9.png",
    audio:"https://res.cloudinary.com/dc0gynqrj/video/upload/v1777795924/0108_9_lzm7vk.mp3"
  },

  {
    img:"assets/slide10.png",
    audio:"https://res.cloudinary.com/dc0gynqrj/video/upload/v1777796090/0108_10_fs3lgp.mp3"
  }

];

/* =========================
   ELEMENTS
========================= */

const slidesContainer =
  document.getElementById("slides");

const progressContainer =
  document.getElementById("progress");

const overlay =
  document.getElementById("startOverlay");

const loaderText =
  document.getElementById("loaderText");

const passwordInput =
  document.getElementById("passwordInput");

const enterBtn =
  document.getElementById("enterBtn");

const passwordError =
  document.getElementById("passwordError");

/* =========================
   STATE
========================= */

let current = 0;

let audios = [];

let currentAudio = null;

let audioUnlocked = false;

let isScrolling = false;

/* =========================
   AUDIO UNLOCKER
========================= */

const unlockAudio = new Audio();

/* =========================
   PRELOAD IMAGES
========================= */

async function preloadImages(){

  const promises = slidesData.map((data, index)=>{

    return new Promise((resolve)=>{

      const img = new Image();

      img.src = data.img;

      img.onload = ()=>{

        loaderText.innerText =
          `Loading ${index + 1}/${slidesData.length}`;

        resolve();

      };

      img.onerror = resolve;

    });

  });

  await Promise.all(promises);

  loaderText.innerText = "Ready";

}

/* =========================
   CREATE SLIDES
========================= */

function createSlides(){

  slidesData.forEach((data)=>{

    /* SLIDE */

    const slide =
      document.createElement("div");

    slide.className = "slide";

    const img =
      document.createElement("img");

    img.src = data.img;

    img.loading = "eager";

    slide.appendChild(img);

    slidesContainer.appendChild(slide);

    /* AUDIO */

    const audio =
      new Audio(data.audio);

    audio.preload = "metadata";

    audio.playsInline = true;

    audio.crossOrigin = "anonymous";

    audios.push(audio);

    /* PROGRESS */

    const bar =
      document.createElement("div");

    bar.className = "bar";

    const inner =
      document.createElement("div");

    inner.className = "bar-inner";

    bar.appendChild(inner);

    progressContainer.appendChild(bar);

  });

}

/* =========================
   UPDATE PROGRESS
========================= */

function updateProgress(){

  document
    .querySelectorAll(".bar-inner")
    .forEach((bar, i)=>{

      bar.style.width =
        i <= current ? "100%" : "0%";

    });

}

/* =========================
   CROSSFADE AUDIO
========================= */

async function crossfade(nextAudio, duration = 700){

  if(!audioUnlocked) return;

  nextAudio.currentTime = 0;
  nextAudio.volume = 0.01;

  try{

    await nextAudio.play();

  }catch(err){

    console.log(err);
    return;

  }

  const previousAudio = currentAudio;

  currentAudio = nextAudio;

  const start = performance.now();

  function animate(now){

    const progress =
      Math.min((now - start) / duration, 1);

    nextAudio.volume = progress;

    if(previousAudio){

      previousAudio.volume = 1 - progress;

    }

    if(progress < 1){

      requestAnimationFrame(animate);

    }else{

      if(previousAudio){

        previousAudio.pause();
        previousAudio.currentTime = 0;

      }

    }

  }

  requestAnimationFrame(animate);

}

/* =========================
   GO TO SLIDE
========================= */

function goToSlide(index){

  if(index < 0) return;

  if(index >= slidesData.length) return;

  current = index;

  slidesContainer.style.transform =
    `translateY(-${index * 100}dvh)`;

  document
    .querySelectorAll(".slide")
    .forEach((slide, i)=>{

      slide.classList.toggle(
        "active",
        i === index
      );

    });

  updateProgress();

  if(audioUnlocked){

    crossfade(audios[index]);

  }

}

/* =========================
   START EXPERIENCE
========================= */

async function startExperience(){

  if(audioUnlocked) return;

  audioUnlocked = true;

  try{

    /* MOBILE AUDIO UNLOCK */

    unlockAudio.muted = true;

    unlockAudio.src =
      audios[0].src;

    await unlockAudio.play();

    unlockAudio.pause();

    unlockAudio.currentTime = 0;

  }catch(err){

    console.log("Audio unlock failed", err);

  }

  /* HIDE OVERLAY PROPERLY */

  overlay.style.opacity = "0";
  overlay.style.visibility = "hidden";
  overlay.style.pointerEvents = "none";

  setTimeout(()=>{

    overlay.style.display = "none";

  }, 600);

  /* START FIRST AUDIO */

  setTimeout(async ()=>{

    try{

      const firstAudio = audios[0];

      firstAudio.volume = 1;

      firstAudio.currentTime = 0;

      await firstAudio.play();

      currentAudio = firstAudio;

    }catch(err){

      console.log(err);

    }

  }, 300);

}

/* =========================
   PASSWORD CHECK
========================= */

async function attemptStart(){

  const entered =
    passwordInput.value.trim();

  if(entered !== PASSWORD){

    passwordError.innerText =
      "Incorrect password";

    passwordInput.value = "";

    return;

  }

  passwordError.innerText = "";

  await startExperience();

}

enterBtn.addEventListener(
  "click",
  attemptStart
);

passwordInput.addEventListener(
  "keydown",
  (e)=>{

    if(e.key === "Enter"){

      attemptStart();

    }

  }
);

/* =========================
   WHEEL NAVIGATION
========================= */

window.addEventListener(
  "wheel",
  (e)=>{

    if(!audioUnlocked) return;

    if(isScrolling) return;

    isScrolling = true;

    if(e.deltaY > 0){

      goToSlide(current + 1);

    }else{

      goToSlide(current - 1);

    }

    setTimeout(()=>{

      isScrolling = false;

    }, 800);

  },
  { passive:true }
);

/* =========================
   TOUCH NAVIGATION
========================= */

let startY = 0;

window.addEventListener(
  "touchstart",
  (e)=>{

    startY =
      e.touches[0].clientY;

  },
  { passive:true }
);

window.addEventListener(
  "touchend",
  (e)=>{

    if(!audioUnlocked) return;

    if(isScrolling) return;

    const endY =
      e.changedTouches[0].clientY;

    const diff = startY - endY;

    if(Math.abs(diff) < 50) return;

    isScrolling = true;

    if(diff > 0){

      goToSlide(current + 1);

    }else{

      goToSlide(current - 1);

    }

    setTimeout(()=>{

      isScrolling = false;

    }, 800);

  },
  { passive:true }
);

/* =========================
   INIT
========================= */

(async function init(){

  createSlides();

  await preloadImages();

  goToSlide(0);

})();

</script>

</body>
</html>
